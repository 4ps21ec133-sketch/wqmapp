
<script>
  // ============================================
  // UUIDs: MATCH YOUR ESP32 BLE CODE
  // ============================================

  const SERVICE_UUID =
    "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

  const TX_UUID =
    "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

  // ============================================
  // HTML ELEMENTS
  // ============================================

  const connectButton = document.getElementById("connectButton");
  const statusElement = document.getElementById("status");
  const tdsElement = document.getElementById("tds");
  const turbidityElement = document.getElementById("turbidity");
  const temperatureElement = document.getElementById("temperature");
  const qualityElement = document.getElementById("quality");
  const rawDataElement = document.getElementById("rawData");

  let bluetoothDevice = null;
  let txCharacteristic = null;
  let bluetoothBuffer = "";
  let lastAppData = "";

  // Detect MIT App Inventor WebViewer
  const runningInAppInventor =
    typeof window.AppInventor !== "undefined" &&
    typeof window.AppInventor.getWebViewString === "function";

  // ============================================
  // DISPLAY AND PARSE COMPLETE SENSOR MESSAGE
  // ============================================

  function parseSensorData(data) {
    const cleanData = String(data)
      .replace(/[\r\n#]/g, "")
      .trim();

    if (!cleanData) return;

    rawDataElement.textContent = cleanData;

    const values = {};

    cleanData.split(",").forEach(function (item) {
      const separator = item.indexOf(":");

      if (separator === -1) return;

      const key = item.substring(0, separator).trim();
      const value = item.substring(separator + 1).trim();

      values[key] = value;
    });

    if (values.TDS !== undefined) {
      tdsElement.textContent = values.TDS;
    }

    if (values.TURB !== undefined) {
      turbidityElement.textContent = values.TURB;
    }

    if (values.TEMP !== undefined) {
      const temp = Number(values.TEMP);

      temperatureElement.textContent =
        Number.isFinite(temp) && temp !== -127
          ? temp.toFixed(2)
          : "Sensor error";
    }

    if (values.Q !== undefined) {
      qualityElement.textContent = values.Q;

      const colors = {
        PURE: "#70e1a1",
        EXCELLENT: "#55d6ff",
        GOOD: "#76a9ff",
        FAIR: "#ffd166",
        HIGH: "#ff7272"
      };

      qualityElement.style.color =
        colors[values.Q] || "#ffffff";
    }
  }

  // ============================================
  // MODE 1: MIT APP INVENTOR WEBVIEWER
  // Native BluetoothLE1 receives ESP32 data.
  // WebViewerString carries complete messages.
  // ============================================

  if (runningInAppInventor) {
    connectButton.style.display = "none";

    statusElement.textContent =
      "📱 Select ESP32 using the app Bluetooth button.";

    window.setInterval(function () {
      let incoming;

      try {
        incoming = window.AppInventor.getWebViewString();
      } catch (error) {
        return;
      }

      if (typeof incoming !== "string") return;

      const cleaned = incoming.trim();

      if (!cleaned || cleaned === lastAppData) return;

      lastAppData = cleaned;

      parseSensorData(cleaned);

      statusElement.textContent =
        "🟢 Receiving data through App Inventor BLE";
    }, 250);
  }

  // ============================================
  // MODE 2: NORMAL CHROME WEBSITE
  // Chrome connects directly to ESP32 using BLE.
  // ============================================

  else {
    connectButton.addEventListener("click", async function () {
      if (!navigator.bluetooth) {
        statusElement.textContent =
          "❌ Web Bluetooth unavailable. Open this site in supported Chrome on HTTPS.";
        return;
      }

      connectButton.disabled = true;

      try {
        statusElement.textContent = "🔵 Selecting ESP32...";

        bluetoothDevice =
          await navigator.bluetooth.requestDevice({
            filters: [
              { name: "Water Quality Monitor" }
            ],
            optionalServices: [SERVICE_UUID]
          });

        bluetoothDevice.addEventListener(
          "gattserverdisconnected",
          disconnected
        );

        statusElement.textContent = "🔵 Connecting...";

        const server =
          await bluetoothDevice.gatt.connect();

        const service =
          await server.getPrimaryService(SERVICE_UUID);

        txCharacteristic =
          await service.getCharacteristic(TX_UUID);

        txCharacteristic.addEventListener(
          "characteristicvaluechanged",
          handleNotifications
        );

        await txCharacteristic.startNotifications();

        statusElement.textContent =
          "🟢 Connected: " + bluetoothDevice.name;

        connectButton.textContent = "CONNECTED";

      } catch (error) {
        console.error("BLE error:", error);

        statusElement.textContent =
          "❌ Connection failed: " + error.message;

        connectButton.disabled = false;
      }
    });
  }

  // ============================================
  // REASSEMBLE ESP32 BLE CHUNKS IN CHROME
  // The ESP32 message ends with #
  // ============================================

  function handleNotifications(event) {
    const text = new TextDecoder().decode(event.target.value);

    bluetoothBuffer += text;

    let endIndex;

    while ((endIndex = bluetoothBuffer.indexOf("#")) !== -1) {
      const completeMessage =
        bluetoothBuffer.substring(0, endIndex);

      bluetoothBuffer = bluetoothBuffer.substring(endIndex + 1);

      if (completeMessage.trim()) {
        parseSensorData(completeMessage);
      }
    }
  }

  // ============================================
  // DISCONNECT
  // ============================================

  function disconnected() {
    statusElement.textContent = "🔴 Disconnected";
    connectButton.textContent = "CONNECT ESP32";
    connectButton.disabled = false;
    txCharacteristic = null;
    bluetoothBuffer = "";
  }
</script>
